<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="<%= htmlWebpackPlugin.options.productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <% if (ctx.prod) { %>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://changelly.com https://*.changelly.com https://quickex.io https://*.quickex.io; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:12313 https://api.beldex.dev https://api.changelly.com; object-src 'none'; base-uri 'none'; form-action 'self';"
    />
    <% } %>
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova) { %>, viewport-fit=cover<% } %>"
    />
    <title><%= htmlWebpackPlugin.options.productName %></title>
  </head>
  <body>
    <noscript>
      This is your fallback content in case JavaScript fails to load.
    </noscript>

    <!-- DO NOT touch the following <div> -->
    <div id="q-app"></div>

    <!-- built files will be auto injected here -->
  </body>
</html>
